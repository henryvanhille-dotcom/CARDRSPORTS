# Managed production service for CARDR. The attached disk keeps SQLite and
# uploaded card photos outside Render's otherwise ephemeral filesystem.
services:
  - type: web
    name: cardr-sports-app
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CARDR_DATA_DIR
        value: /var/data
      - key: CARDR_ALLOWED_HOSTS
        value: cardrsports.com,www.cardrsports.com
    disk:
      name: cardr-data
      mountPath: /var/data
      sizeGB: 1

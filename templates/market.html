<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b14">
  <title>Prospectr — Market</title>
  <style>
    :root { color-scheme: dark; --bg: #080b14; --surface: #111625; --line: rgba(255,255,255,.09); --text: #f7f9fc; --muted: #8d98ad; --blue: #69b9ff; --green: #49d98a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(circle at 15% 0, rgba(59,130,246,.18), transparent 28%), var(--bg); }
    .page { width: min(1040px, calc(100% - 32px)); margin: auto; padding: 22px 0 64px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 48px; }
    .brand { color: var(--text); font-size: 20px; font-weight: 950; letter-spacing: 1.5px; text-decoration: none; }
    .brand span, .eyebrow { color: var(--blue); }
    .back { color: var(--muted); font-size: 13px; font-weight: 750; text-decoration: none; }
    .back:hover { color: var(--text); }
    .hero { padding: 50px 0 28px; }
    .eyebrow { font-size: 11px; font-weight: 850; letter-spacing: 1.8px; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: clamp(38px, 7vw, 66px); line-height: .96; letter-spacing: -3px; }
    .intro { max-width: 650px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
    .toolbar { display: flex; align-items: center; gap: 12px; margin: 12px 0 18px; }
    .search { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; outline: none; background: rgba(17,22,37,.9); color: var(--text); font: inherit; }
    .search:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(105,185,255,.14); }
    .count { flex: none; color: var(--muted); font-size: 12px; font-weight: 750; }
    .summary { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .chip { padding: 8px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: rgba(255,255,255,.025); font-size: 11px; font-weight: 750; }
    .chip strong { color: var(--text); }
    .sales { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .sale { display: flex; flex-direction: column; gap: 14px; min-height: 184px; padding: 18px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
    .sale-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .sale-title { margin: 0; font-size: 15px; line-height: 1.35; }
    .sale-title a { color: var(--text); text-decoration: none; }
    .sale-title a:hover { color: var(--blue); }
    .price { flex: none; color: var(--green); font-size: 20px; font-weight: 950; letter-spacing: -.6px; white-space: nowrap; }
    .metadata { display: flex; flex-wrap: wrap; gap: 7px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .metadata span { padding-right: 7px; border-right: 1px solid var(--line); }
    .metadata span:last-child { border-right: 0; }
    .sale-bottom { display: flex; justify-content: space-between; gap: 12px; margin-top: auto; color: var(--muted); font-size: 11px; }
    .source { color: #bfdbfe; font-weight: 800; }
    .empty, .loading { grid-column: 1 / -1; padding: 44px 22px; border: 1px dashed var(--line); border-radius: 18px; color: var(--muted); text-align: center; line-height: 1.55; }
    .empty strong { display: block; margin-bottom: 6px; color: var(--text); font-size: 17px; }
    @media (max-width: 700px) { .page { width: calc(100% - 24px); } .hero { padding-top: 34px; } .sales { grid-template-columns: 1fr; } .sale { min-height: 0; } }
    @media (max-width: 420px) { .toolbar { align-items: stretch; flex-direction: column; } .count { padding-left: 2px; } .sale-top { flex-direction: column; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar"><a class="brand" href="/">PROSPECTR<span>.</span></a><a class="back" href="/">← Dashboard</a></header>
    <section class="hero"><div class="eyebrow">Stored sale evidence</div><h1>Recent market sales</h1><p class="intro">Completed sales currently stored in Prospectr. Search the evidence by player, product, grade, or source.</p></section>
    <div class="toolbar"><input class="search" id="search" type="search" placeholder="Search player, set, grade, or source" autocomplete="off"><span class="count" id="visibleCount">Loading sales…</span></div>
    <div class="summary" id="summary"></div>
    <section class="sales" id="sales"><div class="loading">Loading stored market evidence…</div></section>
  </main>
  <script>
    let sales = [];
    const searchInput = document.getElementById("search");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function money(value) {
      return new Intl.NumberFormat("en-CA", { style: "currency", currency: "CAD" }).format(Number(value));
    }

    function saleDetails(sale) {
      return [sale.player, sale.year, sale.set_name, sale.card_number ? `#${sale.card_number}` : "", sale.parallel, sale.grade]
        .filter(Boolean)
        .join(" · ");
    }

    function renderSummary(quality) {
      const count = Number(quality.stored_sales_count || 0);
      const sources = (quality.sources || []).join(", ") || "No sources yet";
      const excluded = Number(quality.sample_rows_excluded || 0);
      document.getElementById("summary").innerHTML = `
        <span class="chip"><strong>${count}</strong> stored sale${count === 1 ? "" : "s"}</span>
        <span class="chip">Sources: <strong>${escapeHtml(sources)}</strong></span>
        <span class="chip">${excluded} sample row${excluded === 1 ? "" : "s"} excluded</span>
      `;
    }

    function renderSales() {
      const term = searchInput.value.trim().toLowerCase();
      const visible = sales.filter(sale => [sale.title, sale.player, sale.year, sale.set_name, sale.parallel, sale.grade, sale.platform]
        .join(" ").toLowerCase().includes(term));
      document.getElementById("visibleCount").textContent = `${visible.length} sale${visible.length === 1 ? "" : "s"} shown`;
      const container = document.getElementById("sales");
      if (!visible.length) {
        container.innerHTML = `<div class="empty"><strong>No matching sales</strong>Try a different player, product, grade, or source.</div>`;
        return;
      }
      container.innerHTML = visible.map(sale => {
        const title = escapeHtml(sale.title || "Imported card sale");
        const titleMarkup = sale.listing_url
          ? `<a href="${escapeHtml(sale.listing_url)}" target="_blank" rel="noreferrer">${title}</a>`
          : title;
        return `<article class="sale"><div class="sale-top"><h2 class="sale-title">${titleMarkup}</h2><div class="price">${money(sale.price_cad)}</div></div><div class="metadata">${escapeHtml(saleDetails(sale)).split(" · ").map(item => `<span>${item}</span>`).join("")}</div><div class="sale-bottom"><span class="source">${escapeHtml(sale.platform || "Imported sale")}</span><span>${escapeHtml(sale.sale_date || "Date unavailable")}</span></div></article>`;
      }).join("");
    }

    async function loadSales() {
      try {
        const response = await fetch("/api/recent-sales?limit=100");
        if (!response.ok) throw new Error("Could not load market evidence.");
        const data = await response.json();
        sales = data.sales || [];
        renderSummary(data.data_quality || {});
        renderSales();
      } catch (error) {
        document.getElementById("visibleCount").textContent = "Market unavailable";
        document.getElementById("sales").innerHTML = `<div class="empty"><strong>Couldn't load market sales</strong>Check that the Prospectr server is running, then try again.</div>`;
      }
    }

    searchInput.addEventListener("input", renderSales);
    loadSales();
  </script>
</body>
</html>
